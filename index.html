<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Jzenn ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(circle at 15% 15%, #fff7fb 0%, transparent 25%),
        radial-gradient(circle at 85% 20%, #ffd6e8 0%, transparent 30%),
        linear-gradient(135deg, #ffd9e8, #ffc1da, #f8aacb);

    color: #8c4264;
}


/* =========================
   BACKGROUND DECORATIONS
========================= */

.bg-heart {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: .45;
    color: #ffffff;
    font-size: 20px;
    animation: floatAround 8s ease-in-out infinite;
}

.h1 { top: 12%; left: 7%; animation-delay: 0s; }
.h2 { top: 28%; right: 8%; animation-delay: 2s; }
.h3 { bottom: 18%; left: 10%; animation-delay: 4s; }
.h4 { bottom: 10%; right: 12%; animation-delay: 1s; }

@keyframes floatAround {

    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-20px) rotate(8deg);
    }
}


/* =========================
   INTRO
========================= */

.intro {
    min-height: 100svh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 35px 20px;

    position: relative;
    z-index: 2;

    transition: 1s ease;
}

.top-text {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: #a34d73;

    margin-bottom: 10px;
}

.title {
    font-family: 'Great Vibes', cursive;

    font-size: clamp(65px, 18vw, 110px);

    color: #c63f78;

    line-height: .9;

    text-shadow:
        0 5px 15px rgba(164, 51, 101, .15);

    margin-bottom: 15px;
}

.subtitle {
    font-family: 'Dancing Script', cursive;

    font-size: 22px;

    color: #9b4a6c;

    margin-bottom: 25px;
}


/* =========================
   BOUQUET
========================= */

.bouquet-area {

    width: min(330px, 90vw);
    height: 390px;

    position: relative;

    cursor: pointer;

    transition: .4s ease;
}

.bouquet-area:hover {
    transform: translateY(-5px) scale(1.03);
}

.bouquet-area:active {
    transform: scale(.96);
}


/* FLOWERS */

.flower {
    position: absolute;

    width: 72px;
    height: 72px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff8fb 3%,
            #ffd1e3 22%,
            #f994ba 55%,
            #dc4d85 100%
        );

    box-shadow:
        0 8px 20px rgba(175, 55, 102, .18);

    z-index: 3;
}

.flower::before,
.flower::after {

    content: "";

    position: absolute;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: inherit;
}

.flower::before {
    top: -20px;
    left: 12px;
}

.flower::after {
    left: -20px;
    top: 12px;
}

.flower span {

    position: absolute;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: inherit;

    right: -20px;
    top: 12px;
}

.flower i {

    position: absolute;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: inherit;

    bottom: -20px;
    left: 12px;
}


/* FLOWER CENTER */

.flower-center {

    position: absolute;

    width: 23px;
    height: 23px;

    border-radius: 50%;

    background: #ffd978;

    top: 25px;
    left: 25px;

    z-index: 5;

    box-shadow:
        0 0 0 5px rgba(255, 224, 122, .18);
}


/* FLOWER POSITIONS */

.f1 {
    top: 65px;
    left: 38px;
    transform: scale(.85);
}

.f2 {
    top: 25px;
    left: 125px;
    transform: scale(1.05);
}

.f3 {
    top: 65px;
    right: 38px;
    transform: scale(.85);
}

.f4 {
    top: 125px;
    left: 80px;
    transform: scale(1);
}

.f5 {
    top: 130px;
    right: 70px;
    transform: scale(.92);
}

.f6 {
    top: 170px;
    left: 32px;
    transform: scale(.75);
}

.f7 {
    top: 185px;
    left: 125px;
    transform: scale(.95);
}

.f8 {
    top: 175px;
    right: 30px;
    transform: scale(.75);
}


/* =========================
   LEAVES
========================= */

.leaf {

    position: absolute;

    width: 65px;
    height: 32px;

    background: #78a86b;

    border-radius:
        100% 0
        100% 0;

    z-index: 2;
}

.l1 {
    top: 205px;
    left: 30px;
    transform: rotate(-35deg);
}

.l2 {
    top: 215px;
    right: 20px;
    transform: rotate(35deg);
}

.l3 {
    top: 250px;
    left: 70px;
    transform: rotate(15deg);
}

.l4 {
    top: 250px;
    right: 65px;
    transform: rotate(-15deg);
}


/* =========================
   STEMS
========================= */

.stem {

    position: absolute;

    width: 8px;
    height: 150px;

    background: #65935b;

    bottom: 70px;

    left: 50%;

    transform-origin: bottom;

    z-index: 1;

    border-radius: 20px;
}

.s1 { transform: rotate(-18deg); }
.s2 { transform: rotate(-9deg); }
.s3 { transform: rotate(0deg); }
.s4 { transform: rotate(9deg); }
.s5 { transform: rotate(18deg); }


/* =========================
   WRAPPING
========================= */

.wrapper {

    position: absolute;

    bottom: 5px;
    left: 50%;

    transform: translateX(-50%);

    width: 190px;
    height: 125px;

    background:
        linear-gradient(
            135deg,
            #fff5fa,
            #ffc6dc
        );

    clip-path:
        polygon(
            7% 0%,
            93% 0%,
            100% 100%,
            0% 100%
        );

    z-index: 5;

    box-shadow:
        0 12px 25px rgba(126, 41, 76, .15);
}

.wrapper::before {

    content: "♡";

    position: absolute;

    font-family: 'Great Vibes', cursive;

    font-size: 60px;

    color: #df6595;

    left: 65px;
    top: 25px;
}


/* RIBBON */

.ribbon {

    position: absolute;

    width: 46px;
    height: 25px;

    background: #d94882;

    bottom: 27px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 7;

    border-radius: 5px;
}

.ribbon::before,
.ribbon::after {

    content: "";

    position: absolute;

    width: 40px;
    height: 30px;

    border: 7px solid #d94882;

    top: -3px;
}

.ribbon::before {

    right: 25px;

    border-radius:
        50% 20%
        50% 20%;
}

.ribbon::after {

    left: 25px;

    border-radius:
        20% 50%
        20% 50%;
}


/* CLICK TEXT */

.click-text {

    font-family: 'Dancing Script', cursive;

    font-size: 21px;

    color: #9b4269;

    margin-top: -5px;

    animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {

    0%,100% {
        opacity: .55;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-4px);
    }
}


/* =========================
   MESSAGE
========================= */

.message-section {

    display: none;

    min-height: 100svh;

    padding:
        50px
        16px
        70px;

    position: relative;

    z-index: 3;

    justify-content: center;
    align-items: center;
}

.message-card {

    width: min(850px, 100%);

    padding:
        clamp(30px, 7vw, 55px)
        clamp(20px, 7vw, 55px);

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(255,239,247,.86)
        );

    border:
        2px solid rgba(255,255,255,.8);

    box-shadow:
        0 20px 60px rgba(133, 42, 80, .18);

    backdrop-filter: blur(15px);

    animation:
        cardAppear 1.2s ease forwards;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform:
            translateY(35px)
            scale(.95);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* MESSAGE TITLE */

.message-title {

    font-family: 'Great Vibes', cursive;

    color: #c13d74;

    text-align: center;

    font-size:
        clamp(48px, 12vw, 78px);

    line-height: 1;

    margin-bottom: 30px;
}


/* ACTUAL LETTER */

.message {

    font-family: 'Dancing Script', cursive;

    font-size:
        clamp(19px, 4.5vw, 25px);

    line-height: 1.75;

    color: #71364f;

    text-align: left;

    white-space: pre-wrap;

    overflow-wrap: break-word;
}


/* SIGNATURE */

.signature {

    text-align: center;

    font-family: 'Great Vibes', cursive;

    font-size:
        clamp(35px, 9vw, 50px);

    color: #c13d74;

    margin-top: 35px;

    opacity: 0;

    transition: 1.5s ease;
}

.signature.show {
    opacity: 1;
}


/* =========================
   FLOATING HEARTS
========================= */

.floating-heart {

    position: fixed;

    bottom: -30px;

    color: #df5b91;

    pointer-events: none;

    z-index: 1;

    animation:
        floatHeart linear forwards;
}

@keyframes floatHeart {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .intro {
        padding:
            25px 12px;
    }

    .top-text {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .subtitle {
        font-size: 19px;
    }

    .bouquet-area {
        transform: scale(.88);
        margin-top: -5px;
        margin-bottom: -10px;
    }

    .bouquet-area:hover {
        transform: scale(.88);
    }

    .message-section {
        padding:
            30px 12px 50px;
    }

    .message-card {

        border-radius: 24px;

        padding:
            32px 21px 38px;
    }

    .message-title {
        margin-bottom: 25px;
    }

    .message {

        font-size: 19px;

        line-height: 1.75;
    }

    .signature {
        margin-top: 30px;
    }
}


/* VERY SMALL PHONES */

@media (max-width: 380px) {

    .bouquet-area {
        transform: scale(.78);
        margin-top: -25px;
        margin-bottom: -30px;
    }

    .bouquet-area:hover {
        transform: scale(.78);
    }

    .message-card {
        padding:
            28px 18px 35px;
    }

    .message {
        font-size: 18px;
        line-height: 1.7;
    }
}

</style>
</head>


<body>


<!-- BACKGROUND HEARTS -->

<div class="bg-heart h1">♡</div>

<!-- =========================

========================= -->

<section class="intro" id="intro">

    <div class="top-text">
        A LITTLE SOMETHING FOR YOU
    </div>

    <h1 class="title">

    </h1>

    <p class="subtitle">
        this one's for you, baby
    </p>


    <!-- BOUQUET -->

    <div
        class="bouquet-area"
        onclick="openLetter()"
    >

        <!-- flowers -->

        <div class="flower f1">
            <span></span>
            <i></i>
            <div class="flower-center"></div>
        </div>

        <div class="flower f2">
            <span></span>
            <i></i>
            <div class="flower-center"></div>
        </div>

        <div class="flower f3">

        <div class="flower f4">

        </div>

        <div class="flower f5">

        </div>

        <div class="flower f7">

        <div class="leaf l1"></div>

        <div class="stem s1"></div>
        <div class="stem s2"></div>

</section>

<audio id="loveSong" loop>
    <source src="light (1).mp3" type="audio/mpeg">
</audio>

<!-- =========================
     LETTER
========================= -->

<section
    class="message-section"
    id="messageSection"
>

    <div class="message-card">

        <h2 class="message-title">
            I love you, Jzenn ♡
        </h2>

        <div
            class="message"
            id="message"
        ></div>

        <div
            class="signature"
            id="signature"
        >
            I love youuu, always ♡
        </div>

    </div>

</section>



<script>


/* =========================
   LETTER TEXT
========================= */

const letter = `I love you, Jzenn. So much more than you probably know. ♡

And please, let's not fight about things like this, okay?

The reason why nagtatampo ako is because sometimes it feels like you're portraying me as someone who wouldn't understand you, or someone who wouldn't be able to understand what you're feeling.

And I just really want you to know that I'm always willing to understand you.

Kapag feelings mo ang usapan, it's never going to be "shallow" or "mababaw" sakin.

Never.

So please, let me love you.

Let me understand you.

And let me be someone you can open up to.

I'm not saying this because I want to be different, ha. And I'm not saying this just because I want to compare myself to anyone you've talked to before.

I just want you to know that with me, walang mababaw.

Whatever you feel matters to me.

What you feel is one of my priorities, okay?

You don't have to make your feelings smaller just because you're scared that I might not understand them.

You don't have to think na baka sabihin ko na mababaw lang yung nararamdaman mo.

If something hurts you, tell me.

If something bothers you, tell me.

If something makes you happy, tell me.

If something is weighing on you, please let me know.

I want to know the things that you don't always know how to explain.

I want to understand you, even when you don't know exactly how to put your feelings into words.

And I know I say sorry a lot.

Madalas ako mag-sorry, and maybe sometimes you think I'm just saying it because I don't know what else to say.

But I want you to know na there's a weight behind every word I say.

Hindi lang siya empty promise.

When I say I'll try to understand you, I mean it.

When I say I'm here, I mean it.

And when I say I love you, I really, really mean it.

I don't want us to keep fighting over misunderstandings when we can just talk to each other, listen, and try to understand where the other person is coming from.

So please, let me love you.

Let me be there for you.

Let me listen to you.

Let me understand you.

And please don't ever feel like your feelings are too much or too small for me.

You matter to me.

Your feelings matter to me.

And you will always have a safe place with me.

I love you, Jzenn.

More than I probably know how to explain.

More than these words can ever completely say.

And even if I say it a thousand times, I hope you never get tired of hearing it.

I love youuu so much, baby. ♡`;


let index = 0;


/* =========================
   OPEN LETTER
========================= */

function openLetter() {

    const intro =
        document.getElementById("intro");

    const messageSection =
        document.getElementById("messageSection");

    const music =
        document.getElementById("loveSong");


    // Start music after bouquet is clicked
    music.volume = 0.5;

    music.play().catch(error => {
        console.log("Music could not autoplay:", error);
    });


    // Hide bouquet page
    intro.style.opacity = "0";

    intro.style.transform =
        "scale(.95)";


    setTimeout(() => {

        intro.style.display = "none";

        messageSection.style.display =
            "flex";

        typeLetter();

    }, 900);
}


/* =========================
   TYPEWRITER
========================= */

function typeLetter() {

    const message =
        document.getElementById("message");


    if (index < letter.length) {

        message.textContent +=
            letter.charAt(index);

        index++;


        let speed = 22;


        if (
            letter.charAt(index - 1) === "."
        ) {
            speed = 420;
        }


        if (
            letter.charAt(index - 1) === ","
        ) {
            speed = 120;
        }


        if (
            letter.charAt(index - 1) === "\n"
        ) {
            speed = 300;
        }


        setTimeout(
            typeLetter,
            speed
        );

    } else {

        document
            .getElementById("signature")
            .classList
            .add("show");

    }
}


/* =========================
   FLOATING HEARTS
========================= */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";


    const symbols = [
        "♡",
        "♥",
        "❤",
        "💕",
        "💗",
        "୨୧"
    ];


    heart.innerHTML =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    heart.style.left =
        Math.random() * 100 + "vw";


    heart.style.fontSize =
        (12 + Math.random() * 18)
        + "px";


    heart.style.animationDuration =
        (5 + Math.random() * 5)
        + "s";


    document.body.appendChild(
        heart
    );


    setTimeout(() => {

        heart.remove();

    }, 10000);
}


setInterval(
    createHeart,
    650
);

</script>

</body>
</html>
